name=libmeshtastic-leaf
version=0.5.0
author=Thomas Göttgens <tgoettgens@gmail.com>
maintainer=Thomas Göttgens <tgoettgens@gmail.com>
sentence=Minimal Arduino library for Meshtastic leaf node operation.
paragraph=Enables sending, receiving, and processing Meshtastic packets without routing or rebroadcasting. Supports channel-based encryption (AES-CTR) and PKI encryption (Curve25519 + AES-CCM). Works with any LoRa radio RadioLib exposes as a PhysicalLayer.
category=Communication
url=https://github.com/caveman99/libmeshtastic-leaf
architectures=*
depends=RadioLib,Nanopb,Crypto
# Crypto must be meshtastic/Crypto, not upstream rweather/Crypto:
# https://github.com/meshtastic/Crypto
