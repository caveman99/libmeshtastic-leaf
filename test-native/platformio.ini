; Host unit tests for libmeshtastic-leaf.
;
;   cd test-native && pio test -e native
;
; This lives in its own project directory on purpose. With a platformio.ini at
; the repository root, PlatformIO treats the root library.json as the project
; manifest and tries to build RadioLib and Crypto for the host, which cannot
; work: both are Arduino-only.

[platformio]
; the payload codec is compiled into the tests; everything else the tests
; touch is header only
src_dir = ../src

[env:native]
test_build_src = true
build_src_filter = +<MeshPayload.cpp> +<generated/meshtastic/*.cpp>
platform = native
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -I../src
    -I../src/generated
lib_deps =
    nanopb/Nanopb@^0.4.9
