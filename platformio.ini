; PlatformIO configuration for libmeshtastic-leaf
;
; Native unit tests:
;   pio test -e native
;
; Examples live in examples/ and are built from examples/platformio.ini.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c++11
    -Wall
    -Wextra
    ; TODO(phase1): drop once MeshTypes.h no longer includes config.pb.h
    -I src/generated
lib_deps =
    nanopb/Nanopb@^0.4.9
