; PlatformIO configuration for libmeshtastic-leaf examples
;
; Build a specific example:
;   pio run -e BasicSendReceive
;   pio run -e TextMessaging
;   pio run -e PKIEncryption
;
; Upload to device:
;   pio run -e BasicSendReceive -t upload

[platformio]
default_envs = BasicSendReceive

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Script to set source directory based on environment name
extra_scripts = pre:set_src_dir.py

; Include the parent library
lib_extra_dirs = ../

; Library dependencies (matching library.json)
lib_deps =
    jgromes/RadioLib@^7.5.0
    nanopb/Nanopb@^0.4.6
    rweather/Crypto@^0.4.0

build_flags =
    -DARDUINO_ARCH_ESP32
    -I ../src/generated

[env:BasicSendReceive]

[env:TextMessaging]

[env:PKIEncryption]
