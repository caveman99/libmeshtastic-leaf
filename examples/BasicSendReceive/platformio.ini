; Build:  pio run
; Upload: pio run -t upload
;
; Run this from inside the BasicSendReceive directory.

[platformio]
; the sketch lives at the root of this example directory
src_dir = .

[env:esp32dev]
; pioarduino platform, matching what the Meshtastic firmware builds against
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; pick up libmeshtastic-leaf from the repository root
lib_extra_dirs = ../../..

lib_deps =
    jgromes/RadioLib@^7.7.1
    nanopb/Nanopb@^0.4.91
    rweather/Crypto@^0.4.0

build_flags =
    ; TODO(phase1): drop once MeshTypes.h no longer includes config.pb.h
    -I ../../src/generated
